<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Heart of Europe | European Fusion Hero</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .serif { font-family: 'Playfair Display', serif; }

        .hero-container {
            width: 1920px;
            height: 1080px;
            position: relative;
            overflow: hidden;
            background-color: #002D5B;
        }

        .background-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.1);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(0, 45, 91, 0.6) 0%, rgba(0, 45, 91, 0.3) 40%, transparent 100%);
        }

        .safe-zone {
            position: relative;
            z-index: 10;
            width: 80%;
            height: 80%;
            margin: 10% auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            color: white;
        }

        .cta-button {
            background-color: #002D5B;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .cta-button:hover {
            background-color: #00B4D8;
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(0, 180, 216, 0.4);
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!--
            Background Image: Representing 'European Fusion'
            Composition: Luxury terrace, Venetian/Swedish architecture, turquoise water, golden hour.
        -->
        <img src="https://d159guvtjjsjmp.cloudfront.net/uploads/2026/01/first-bg-1.png" alt="The Heart of Europe Luxury Terrace" class="background-image">

        <div class="overlay"></div>

        <!-- Logo placement: Top-Left -->
        <div class="absolute top-12 left-12 z-20">
            <img src="https://thoe.com/wp-content/themes/heartofeurope/assets/svg/logo.svg" alt="THOE Logo" class="h-16 w-auto brightness-0 invert">
        </div>

        <!-- Content in Safe Zone -->
        <div class="safe-zone">
            <h1 class="serif text-8xl font-bold mb-6 leading-tight max-w-4xl">
                European Heritage,<br>Dubai Ambition
            </h1>
            <p class="text-2xl font-light mb-12 max-w-2xl leading-relaxed opacity-90 tracking-wide">
                Experience a sanctuary where classical elegance meets the future of island living.
            </p>
            <a href="#" class="cta-button text-white px-12 py-5 rounded-full text-sm font-bold uppercase tracking-[0.2em]">
                Explore the Collection
            </a>
        </div>
    </div>

</body>
</html>
